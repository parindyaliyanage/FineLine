plugins {
    id "com.android.application"
    id 'com.google.gms.google-services'
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new java.util.Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.example.fineline"
    compileSdk flutter.compileSdkVersion
    ndkVersion "27.0.12077973"          // ← updated from 25.2.9519653

    packagingOptions {
        pickFirst '**/*.so'
        doNotStrip '**/*.so'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true   // ← added
        sourceCompatibility JavaVersion.VERSION_11  // ← updated from 1_8
        targetCompatibility JavaVersion.VERSION_11  // ← updated from 1_8
    }

    kotlinOptions {
        jvmTarget = '11'                    // ← updated from '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.fineline"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}